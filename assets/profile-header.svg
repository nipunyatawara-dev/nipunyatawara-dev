<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Nipun Yatawara — software systems and digital craft</title>
  <desc id="desc">A monochrome technical diagram showing Nipun Yatawara's work across web, native applications, and local-first systems.</desc>

  <defs>
    <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#181818" stroke-width="1"/>
    </pattern>
    <pattern id="major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#242424" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080808" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#080808" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="16" fill="#080808"/>
  <rect width="1200" height="420" rx="16" fill="url(#minor-grid)"/>
